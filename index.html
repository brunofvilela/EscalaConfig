<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel de Escala — Técnicos · Tarefas · Ausências</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Painel de Escala</h1>
    <nav class="tabs" role="navigation" aria-label="Navegação">
      <button class="tabBtn active" data-tab="tab-tecnicos">Técnicos</button>
      <button class="tabBtn" data-tab="tab-tarefas">Tarefas</button>
      <button class="tabBtn" data-tab="tab-ausencias">Ausências</button>
    </nav>
  </header>

  <main class="container">
    <!-- TÉCNICOS -->
    <section id="tab-tecnicos" class="tab active"></section>

    <!-- TAREFAS -->
    <section id="tab-tarefas" class="tab"></section>

    <!-- AUSÊNCIAS -->
    <section id="tab-ausencias" class="tab"></section>
  </main>

  <!-- MODAL EDITAR -->
  <div id="modal-edit" class="modal" aria-hidden="true">
    <div class="modal-box">
      <h3 id="modal-title">Editar</h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-save" class="primary">Salvar</button>
        <button id="modal-cancel">Cancelar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
